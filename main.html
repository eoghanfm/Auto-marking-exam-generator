<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-marking website</title>

    <link rel="stylesheet" href="styles.css">

    <script src="https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
</head>
<body>
    <div class="fixed-header">
        <h1>Eoghan's Epic Automarking Website for Ifti</h1>
        <button type="button" class="open-btn" onclick="openSidebar()" aria-label="Open saved tests">☰</button>
        <button type="button" class="settings-btn" onclick="openSettingsSidebar()" aria-label="Open settings">⚙️</button>
    </div>

    <div class="overlay" id="sidebarOverlay" onclick="closeAllSidebars()"></div>
    <div class="overlay" id="popupOverlay" onclick="closePopup()"></div>

    <!-- Saved Tests Sidebar -->
    <div class="sidebar" id="sidebar">
        <h3>Saved Tests</h3>
        <span class="close-btn" onclick="closeSidebar()">×</span>
        <div class="sidebar-content" id="sidebar-content"></div>
    </div>

    <!-- Settings Sidebar -->
    <div class="settingsSidebar" id="settingsSidebar">
        <h3>Settings</h3>
        <span class="close-btn" onclick="closeSettingsSidebar()">×</span>
        <div class="settingsSidebar-content" id="settingsSidebar-content">
            <div class="settings-group">
                <label for="apiKeyInput">OpenAI API Key:</label>
                <input type="password" id="apiKeyInput" placeholder="sk-..." autocomplete="off">
                <button type="button" onclick="saveApiKey()">Save Key</button>
                <div id="apiKeyStatus" class="settings-status"></div>
            </div>
        </div>
    </div>

    <!-- Save Name Popup -->
    <div class="popup" id="popup">
        <button type="button" class="close-btn" onclick="closePopup()">×</button>
        <h3>Name this save:</h3>
        <input type="text" id="nameInput" placeholder="Enter name">
        <br>
        <button type="button" onclick="submitName()">Submit</button>
    </div>

    <!-- Main Container -->
    <div class="container">
        <button type="button" onclick="handleFileUpload()">Upload File</button>
        <div id="file-uploaded-message" class="file-uploaded"></div>

        <div class="counter">
            <span>Multiple Choice Questions:</span>
            <div>
                <button type="button" onclick="updateCounter('multipleChoice', -1)">−</button>
                <span id="multiple-choice-counter">0</span>
                <button type="button" onclick="updateCounter('multipleChoice', 1)">+</button>
            </div>
        </div>

        <div class="counter">
            <span>Choices per Multiple Choice Question:</span>
            <div>
                <button type="button" onclick="updateCounter('choicesPerQuestion', -1)">−</button>
                <span id="choices-per-question-counter">2</span>
                <button type="button" onclick="updateCounter('choicesPerQuestion', 1)">+</button>
            </div>
        </div>

        <div class="counter">
            <span>Short Answer Questions:</span>
            <div>
                <button type="button" onclick="updateCounter('shortAnswer', -1)">−</button>
                <span id="short-answer-counter">0</span>
                <button type="button" onclick="updateCounter('shortAnswer', 1)">+</button>
            </div>
        </div>

        <div id="error-message">Please upload a PDF file before generating questions.</div>

        <form id="questions-form" onsubmit="handleSubmit(event)">
            <div id="questions-container"></div>
            <button id="mainButton" type="submit">Generate Questions</button>
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
